<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finlândia — Apresentação</title>
<style>
:root{--azul:#003580;--escuro:#00172f;--claro:#eef4fc;--branco:#fff;--texto:#12233d;--gelo:#9fc3f0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--claro);color:var(--texto);display:flex;flex-direction:column}
#neve{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#palco{flex:1;display:flex;position:relative;min-height:0}
.slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:4vh 8vw;overflow:auto}
.slide>*{position:relative;z-index:2;max-width:1100px;width:100%;margin-left:auto;margin-right:auto}
.slide.ativo{display:flex;animation:entra .7s cubic-bezier(.2,.7,.2,1)}
.slide.volta{animation-name:entraVolta}
@keyframes entra{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes entraVolta{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
 
/* capa e fim: noite com aurora boreal */
.capa,.fim{text-align:center;align-items:center;background:linear-gradient(180deg,#00091a 0%,#00214d 70%,#0a3a7a 100%);color:var(--branco);overflow:hidden}
.capa>*,.fim>*{margin-left:0;margin-right:0;width:auto}
.aurora{position:absolute!important;inset:-20% -10% 30% -10%;max-width:none!important;z-index:1!important;filter:blur(50px);opacity:.75;pointer-events:none}
.aurora i{position:absolute;display:block;border-radius:50%;width:55%;height:70%;animation:aurora 11s ease-in-out infinite alternate}
.aurora i:nth-child(1){left:0;background:radial-gradient(closest-side,rgba(60,255,170,.8),transparent)}
.aurora i:nth-child(2){left:30%;background:radial-gradient(closest-side,rgba(80,170,255,.8),transparent);animation-duration:14s;animation-delay:-4s}
.aurora i:nth-child(3){left:55%;background:radial-gradient(closest-side,rgba(170,110,255,.65),transparent);animation-duration:17s;animation-delay:-8s}
@keyframes aurora{0%{transform:translate(-8%,5%) scale(.9) rotate(-6deg)}100%{transform:translate(12%,-10%) scale(1.25) rotate(8deg)}}
.floresta{position:absolute!important;left:0;bottom:0;width:100%!important;max-width:none!important;height:26vh;z-index:3!important;margin:0!important}
.capa h1,.fim h1{font-size:clamp(3rem,10vw,6.5rem);letter-spacing:.03em;animation:titulo 1.4s cubic-bezier(.2,.7,.2,1) both;text-shadow:0 4px 30px rgba(0,0,0,.4)}
@keyframes titulo{from{opacity:0;letter-spacing:.4em;filter:blur(10px)}to{opacity:1;letter-spacing:.03em;filter:none}}
.sub{font-size:clamp(1.2rem,3vw,2rem);margin-top:1rem;opacity:.9;animation:sobe .9s .7s both}
.autor{margin-top:2.5rem;font-size:1.1rem;opacity:.85;animation:sobe .9s 1s both}
.bandeira{width:120px;height:72px;background:#fff;border-radius:6px;position:relative;margin-bottom:1.8rem;box-shadow:0 6px 24px rgba(0,0,0,.4);animation:bandeira 1.2s both,ondula 4s 1.2s ease-in-out infinite}
.bandeira::before{content:"";position:absolute;left:30px;top:0;width:18px;height:100%;background:var(--azul)}
.bandeira::after{content:"";position:absolute;left:0;top:27px;width:100%;height:18px;background:var(--azul)}
@keyframes bandeira{from{opacity:0;transform:translateY(-40px) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes ondula{50%{transform:rotate(2deg) translateY(-4px)}}
@keyframes sobe{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
 
/* slides de conteúdo */
.conteudo{background:linear-gradient(160deg,#f7faff,var(--claro))}
.conteudo::before{content:"";position:absolute;right:6vw;top:0;width:34px;height:100%;background:var(--azul);opacity:.07;z-index:0}
.conteudo::after{content:"";position:absolute;left:0;top:18vh;width:100%;height:34px;background:var(--azul);opacity:.07;z-index:0}
h2{font-size:clamp(1.8rem,5vw,3rem);color:var(--azul);padding-bottom:.4rem;margin-bottom:2rem;position:relative}
h2::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:100%;background:linear-gradient(90deg,var(--azul),var(--gelo));transform-origin:left;animation:linha .9s .2s both}
@keyframes linha{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.corpo{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:2.5rem;align-items:start}
.destaques{display:flex;flex-direction:column;gap:1.2rem}
.destaque{background:var(--branco);border-left:6px solid var(--azul);border-radius:10px;padding:1.2rem 1.4rem;box-shadow:0 4px 14px rgba(0,53,128,.14);animation:pop .7s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(.3s + var(--i)*.2s);transition:transform .25s}
.destaque:hover{transform:translateY(-4px) rotate(-.6deg)}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(20px)}to{opacity:1;transform:none}}
.valor{display:block;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:700;color:var(--azul)}
.legenda{display:block;margin-top:.3rem;font-size:1rem}
ul{list-style:none;display:flex;flex-direction:column;gap:.9rem}
li{font-size:clamp(1.05rem,2vw,1.4rem);padding-left:2rem;position:relative;line-height:1.4;animation:sobe .6s both;animation-delay:calc(.5s + var(--i)*.15s)}
li::before{content:"❄";position:absolute;left:0;top:0;color:var(--azul);font-size:1.1em;animation:gira 8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.fonte{margin-top:2rem;font-size:.9rem;opacity:.7;animation:sobe .6s 1.2s both}
.fim .fonte{margin-top:2.5rem;animation-delay:1.2s}
 
/* navegação */
nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;background:var(--escuro);position:relative;z-index:10;border-top:3px solid var(--azul)}
button.botao{background:none;color:var(--branco);padding:.6rem 1.2rem;border:2px solid var(--branco);border-radius:999px;font:inherit;font-weight:600;cursor:pointer;transition:background .2s,color .2s,transform .2s}
button.botao:hover:not(:disabled){background:var(--branco);color:var(--escuro);transform:scale(1.06)}
button.botao:disabled{opacity:.3;cursor:default}
button:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}
#pontos{display:flex;gap:.6rem}
.ponto{width:14px;height:14px;border-radius:50%;border:0;background:rgba(255,255,255,.35);cursor:pointer;transition:transform .3s,background .3s}
.ponto:hover{transform:scale(1.3)}
.ponto.ativo{background:var(--branco);transform:scale(1.35)}
@media(max-width:700px){.corpo{grid-template-columns:1fr}nav{padding:.8rem 1rem}button.botao{padding:.5rem .8rem;font-size:.9rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<canvas id="neve"></canvas>
<div id="palco"></div>
<nav>
  <button class="botao" id="ant">← Anterior</button>
  <span id="pontos"></span>
  <button class="botao" id="seg">Seguinte →</button>
</nav>
 
<script>
const slides = [
  {tipo:'capa', titulo:'Finlândia', sub:'Trabalho de pesquisa', autor:'Paulo Rodrigues · 2PH · 2026/27'},
  {tipo:'conteudo', titulo:'Sobre o país',
   dest:[['5,66 milhões','habitantes (fim de 2025)']],
   pontos:['Nome oficial: República da Finlândia (Suomi, em finlandês)','Independente desde 1917; membro da União Europeia desde 1995','Línguas oficiais: finlandês e sueco','Moeda: euro','Conhecida pelos lagos, florestas, sauna e pela Lapónia'],
   fonte:'Statistics Finland (população); conhecimento geral'},
  {tipo:'conteudo', titulo:'Capital: Helsínquia',
   dest:[['694 392','habitantes (fim de 2025)']],
   pontos:['Capital desde 1812 (antes era Turku)','Cerca de 1,3 milhões de pessoas na região da capital','Área do município: 715 km² (só 214 km² são terra)','A capital mais a norte de um país da UE','Centro político, económico, cultural e científico do país'],
   fonte:'Wikipédia (Helsinki), dados da Statistics Finland'},
  {tipo:'conteudo', titulo:'Área',
   dest:[['≈ 338 000 km²','área total']],
   pontos:['Cerca de 3,7 vezes a área de Portugal (92 212 km²)','Densidade populacional: cerca de 17 hab/km²','Muito despovoada, sobretudo a norte (Lapónia)','A população concentra-se no sul, à volta de Helsínquia'],
   fonte:'Valor aproximado; densidade calculada com 5,66 M hab. ÷ 338 000 km²'},
  {tipo:'conteudo', titulo:'ISF: filhos por mulher',
   dest:[['1,30','filhos por mulher (2025)'],['1,25','em 2024 (mínimo desde 1776)']],
   pontos:['ISF = número médio de filhos por mulher','Subiu ligeiramente em 2025, mas continua longe dos 2,1 necessários para renovar a população','Mais alto nas Ostrobotnia e Åland; mais baixo nas grandes cidades (Helsínquia: 1,08)'],
   fonte:'Statistics Finland, Births 2025 e 2024'},
  {tipo:'conteudo', titulo:'Casamentos e divórcios',
   dest:[['22 082','casamentos em 2025 (≈ 3,9 por 1000 hab.)'],['11 795','divórcios em 2025 (≈ 2,1 por 1000 hab.)']],
   pontos:['Casamentos aumentaram 662 face a 2024','Idade média no 1.º casamento: 32,6 anos (mulheres) e 34,4 anos (homens)','Taxas por 1000 habitantes calculadas a partir dos totais e da população'],
   fonte:'Statistics Finland, Changes in marital status 2025'},
  {tipo:'fim', titulo:'Kiitos! Obrigado!', sub:'Perguntas?', fontes:'Fontes: Statistics Finland (stat.fi), Yle News, Wikipédia'}
];
 
const palco = document.getElementById('palco');
const pontosEl = document.getElementById('pontos');
const ant = document.getElementById('ant');
const seg = document.getElementById('seg');
let atual = -1;
 
/* pinheiros em SVG */
function floresta(){
  let p='', x=-20;
  while(x<1220){
    const h=90+Math.random()*90, w=40+Math.random()*30, c=x+w/2;
    p+=`<path d="M${c} ${200-h} L${x+w} 200 L${x} 200Z"/>`;
    x+=w*.55;
  }
  return `<svg class="floresta" viewBox="0 0 1200 200" preserveAspectRatio="none" fill="#00091a" aria-hidden="true">${p}</svg>`;
}
const noite = `<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>`;
 
function html(s){
  if(s.tipo==='capa') return `${noite}<div class="bandeira"></div><h1>${s.titulo}</h1><p class="sub">${s.sub}</p><p class="autor">${s.autor}</p>${floresta()}`;
  if(s.tipo==='fim') return `${noite}<h1>${s.titulo}</h1><p class="sub">${s.sub}</p><p class="fonte">${s.fontes}</p>${floresta()}`;
  return `<h2>${s.titulo}</h2><div class="corpo">
    <div class="destaques">${s.dest.map((d,i)=>`<div class="destaque" style="--i:${i}"><span class="valor">${d[0]}</span><span class="legenda">${d[1]}</span></div>`).join('')}</div>
    <ul>${s.pontos.map((p,i)=>`<li style="--i:${i}">${p}</li>`).join('')}</ul></div>
    <p class="fonte">Fonte: ${s.fonte}</p>`;
}
 
slides.forEach((s,i)=>{
  const m = document.createElement('main');
  m.className = 'slide ' + s.tipo;
  m.innerHTML = html(s);
  palco.appendChild(m);
  const p = document.createElement('button');
  p.className = 'ponto';
  p.setAttribute('aria-label','Slide '+(i+1));
  p.onclick = () => ir(i);
  pontosEl.appendChild(p);
});
 
/* números que contam até ao valor */
function contar(el){
  const t = el.dataset.t || (el.dataset.t = el.textContent);
  const m = t.match(/\d+(?: \d{3})*(?:,\d+)?/);
  if(!m || matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=t;return}
  const alvo = parseFloat(m[0].replace(/ /g,'').replace(',','.'));
  const dec = (m[0].split(',')[1]||'').length;
  const ini = performance.now(), dur = 1400;
  (function passo(n){
    const k = Math.min(1,(n-ini)/dur), e = 1-Math.pow(1-k,3);
    const v = (alvo*e).toLocaleString('pt-PT',{minimumFractionDigits:dec,maximumFractionDigits:dec});
    el.textContent = t.replace(m[0], v);
    if(k<1) requestAnimationFrame(passo); else el.textContent = t;
  })(ini);
}
 
function ir(n){
  n = Math.max(0, Math.min(slides.length-1, n));
  if(n===atual) return;
  const volta = n<atual;
  atual = n;
  [...palco.children].forEach((el,i)=>{
    el.classList.remove('ativo','volta');
    if(i===atual){ void el.offsetWidth; el.classList.add('ativo'); if(volta) el.classList.add('volta'); }
  });
  [...pontosEl.children].forEach((el,i)=>el.classList.toggle('ativo', i===atual));
  ant.disabled = atual===0;
  seg.textContent = atual===slides.length-1 ? 'Recomeçar ↺' : 'Seguinte →';
  palco.children[atual].querySelectorAll('.valor').forEach(contar);
  cor = slides[atual].tipo==='conteudo' ? '143,176,224' : '255,255,255';
  history.replaceState(null,'','#'+atual);
}
 
ant.onclick = () => ir(atual-1);
seg.onclick = () => ir(atual===slides.length-1 ? 0 : atual+1);
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();seg.click()}
  if(e.key==='ArrowLeft') ant.click();
});
 
/* neve */
const cv = document.getElementById('neve'), cx = cv.getContext('2d');
let cor = '255,255,255', flocos = [];
function medir(){cv.width=innerWidth;cv.height=innerHeight}
addEventListener('resize',medir); medir();
for(let i=0;i<110;i++) flocos.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:1+Math.random()*3,v:.4+Math.random()*1.2,o:Math.random()*6});
function neva(t){
  cx.clearRect(0,0,cv.width,cv.height);
  for(const f of flocos){
    f.y+=f.v; f.x+=Math.sin(t/1400+f.o)*.5;
    if(f.y>cv.height){f.y=-5;f.x=Math.random()*cv.width}
    cx.beginPath(); cx.arc(f.x,f.y,f.r,0,7);
    cx.fillStyle=`rgba(${cor},${.35+f.r/6})`; cx.fill();
  }
  requestAnimationFrame(neva);
}
if(!matchMedia('(prefers-reduced-motion:reduce)').matches) requestAnimationFrame(neva);
 
ir(parseInt(location.hash.slice(1)) || 0);
</script>
</body>
</html>
